# Grafana Dashboards Provisioning (Sprint 3)

apiVersion: 1

providers:
  - name: 'Antika Auction Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
