groups:
  - name: antika_slo_alerts
    interval: 30s
    rules:
      # API Latency SLO: p99 should be < 400ms
      - alert: HighAPILatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.4
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API p99 latency detected"
          description: "API p99 latency is {{ $value }}s (threshold: 0.4s) for {{ $labels.instance }}"

      # Redis Cache Hit Ratio SLO: should be > 80%
      - alert: LowRedisCacheHitRatio
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.8
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis cache hit ratio is low"
          description: "Redis hit ratio is {{ $value | humanizePercentage }} (threshold: 80%) for {{ $labels.instance }}"

      # Critical: API is down
      - alert: APIDown
        expr: up{job="backend_api"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Backend API is down"
          description: "Backend API {{ $labels.instance }} has been down for more than 1 minute"

      # Database connection issues
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL {{ $labels.instance }} has been down for more than 1 minute"

      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis {{ $labels.instance }} has been down for more than 1 minute"

      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"

      # Disk space running out
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Disk space is running low"
          description: "Disk space on {{ $labels.instance }} is below 10% ({{ $value | humanizePercentage }} remaining)"

      # Memory usage high
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage"
          description: "Memory usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}"

      # Too many pending feedback entries (learning loop issue)
      - alert: FeedbackBacklog
        expr: advisor_feedback_pending_count > 100
        for: 30m
        labels:
          severity: warning
          component: learning
        annotations:
          summary: "Feedback processing backlog"
          description: "{{ $value }} feedback entries pending processing for over 30 minutes"

      # Advisor accuracy dropping
      - alert: AdvisorAccuracyDrop
        expr: (advisor_accuracy_rate - advisor_accuracy_rate offset 1h) < -0.05
        for: 15m
        labels:
          severity: warning
          component: advisor
        annotations:
          summary: "Advisor accuracy has dropped"
          description: "Advisor accuracy dropped by {{ $value | humanizePercentage }} in the last hour"

      # WebSocket connection issues
      - alert: WebSocketConnectionFailures
        expr: rate(websocket_connection_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "High WebSocket connection failure rate"
          description: "WebSocket failures: {{ $value }} per second on {{ $labels.instance }}"

      # SSL certificate expiring soon
      - alert: SSLCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
        for: 1h
        labels:
          severity: warning
          component: security
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate expires in {{ $value }} days"
