global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@antika-auction.com'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'

# Templates for alerts
templates:
  - '/etc/alertmanager/*.tmpl'

# Route tree
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 5m
      continue: true

    # Warning alerts - batched notifications
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 5m
      repeat_interval: 4h

    # API-specific alerts
    - match:
        component: api
      receiver: 'api-team'
      continue: true

    # Database alerts
    - match:
        component: database
      receiver: 'database-team'
      continue: true

    # Learning/AI alerts
    - match:
        component: advisor
      receiver: 'ml-team'

# Inhibition rules (suppress alerts when higher severity is firing)
inhibit_rules:
  # If API is down, don't alert on high latency
  - source_match:
      alertname: 'APIDown'
    target_match:
      alertname: 'HighAPILatency'
    equal: ['instance']

  # If Redis is down, don't alert on cache hit ratio
  - source_match:
      alertname: 'RedisDown'
    target_match:
      alertname: 'LowRedisCacheHitRatio'
    equal: ['instance']

# Receivers
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'ops@antika-auction.com'
        headers:
          Subject: '[Antika] Alert: {{ .GroupLabels.alertname }}'
        html: |
          <h2>Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><a href="{{ .ExternalURL }}">View in Alertmanager</a></p>

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@antika-auction.com,cto@antika-auction.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    # Add PagerDuty/Slack/etc here
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#alerts-critical'
    #     title: 'CRITICAL: {{ .GroupLabels.alertname }}'
    #     text: '{{ .CommonAnnotations.description }}'

  - name: 'warning-alerts'
    email_configs:
      - to: 'devops@antika-auction.com'
        send_resolved: true
        headers:
          Subject: '[Warning] {{ .GroupLabels.alertname }}'

  - name: 'api-team'
    email_configs:
      - to: 'api-team@antika-auction.com'
        headers:
          Subject: '[API] {{ .GroupLabels.alertname }}'

  - name: 'database-team'
    email_configs:
      - to: 'dba@antika-auction.com'
        headers:
          Subject: '[Database] {{ .GroupLabels.alertname }}'

  - name: 'ml-team'
    email_configs:
      - to: 'ml-team@antika-auction.com'
        headers:
          Subject: '[Advisor/ML] {{ .GroupLabels.alertname }}'
