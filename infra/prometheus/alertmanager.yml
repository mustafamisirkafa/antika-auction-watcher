# Alertmanager Configuration (Sprint 3)

global:
  resolve_timeout: 5m
  # Telegram bot configuration
  # Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID environment variables

route:
  group_by: ['alertname', 'cluster', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'telegram-critical'
  
  routes:
    # Critical alerts ? Telegram immediately
    - match:
        severity: critical
      receiver: 'telegram-critical'
      continue: true
    
    # Warning alerts ? Telegram with delay
    - match:
        severity: warning
      receiver: 'telegram-warnings'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    
    # Info alerts ? Email only (if configured)
    - match:
        severity: info
      receiver: 'email'
      group_interval: 1h
      repeat_interval: 24h

receivers:
  # Telegram receiver for critical alerts
  - name: 'telegram-critical'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        api_url: 'https://api.telegram.org'
        parse_mode: 'HTML'
        message: |
          ?? <b>CRITICAL ALERT</b>
          
          <b>Alert:</b> {{ .GroupLabels.alertname }}
          <b>Severity:</b> {{ .CommonLabels.severity }}
          <b>Component:</b> {{ .CommonLabels.component }}
          
          <b>Summary:</b> {{ .CommonAnnotations.summary }}
          <b>Description:</b> {{ .CommonAnnotations.description }}
          
          <b>Runbook:</b> {{ .CommonAnnotations.runbook }}
          
          <b>Started:</b> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          <b>Environment:</b> {{ .CommonLabels.environment }}
  
  # Telegram receiver for warnings
  - name: 'telegram-warnings'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        api_url: 'https://api.telegram.org'
        parse_mode: 'HTML'
        message: |
          ?? <b>WARNING</b>
          
          <b>Alert:</b> {{ .GroupLabels.alertname }}
          <b>Component:</b> {{ .CommonLabels.component }}
          
          <b>Summary:</b> {{ .CommonAnnotations.summary }}
          <b>Description:</b> {{ .CommonAnnotations.description }}
          
          <b>Started:</b> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
  
  # Email receiver (optional, requires SMTP config)
  - name: 'email'
    email_configs:
      - to: 'ops@antika.auction'
        from: 'alertmanager@antika.auction'
        smarthost: 'smtp.gmail.com:587'
        auth_username: '${SMTP_USER}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: '{{ .GroupLabels.alertname }} - {{ .CommonLabels.severity }}'
        html: |
          <h2>Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Component:</strong> {{ .CommonLabels.component }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Runbook:</strong> {{ .CommonAnnotations.runbook }}</p>
          <p><strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}</p>

inhibit_rules:
  # Inhibit warning if critical alert is firing for same component
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'component']
  
  # Inhibit redis warnings if redis is down
  - source_match:
      alertname: 'RedisDown'
    target_match_re:
      alertname: 'LowRedisCacheHitRate|HighRedisMemoryUsage'
    equal: ['component']
  
  # Inhibit database warnings if database is down
  - source_match:
      alertname: 'DatabaseDown'
    target_match_re:
      alertname: 'HighDatabaseConnections|SlowDatabaseQueries'
    equal: ['component']
