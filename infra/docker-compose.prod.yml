version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: antika_postgres
    environment:
      POSTGRES_DB: antika_db
      POSTGRES_USER: antika_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - antika_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antika_user -d antika_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: antika_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./backups:/backups
    networks:
      - antika_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: antika_backend
    environment:
      - DATABASE_URL=postgresql://antika_user:${POSTGRES_PASSWORD}@postgres:5432/antika_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./logs/backend:/app/logs
    networks:
      - antika_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"

  # Feedback Learning Loop
  learning_loop:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: antika_learning_loop
    command: python -m backend.tasks.feedback_learning_loop --interval 30
    environment:
      - DATABASE_URL=postgresql://antika_user:${POSTGRES_PASSWORD}@postgres:5432/antika_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LOG_LEVEL=INFO
    volumes:
      - ./logs/learning:/app/logs
    networks:
      - antika_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api/v1
        - NEXT_PUBLIC_WS_URL=wss://${DOMAIN}/api/v1/ws
    container_name: antika_frontend
    networks:
      - antika_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: antika_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - antika_network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9113"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: antika_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - antika_network
    restart: unless-stopped
    ports:
      - "9090:9090"

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: antika_alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - antika_network
    restart: unless-stopped
    ports:
      - "9093:9093"

  # Loki Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: antika_loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - antika_network
    restart: unless-stopped
    ports:
      - "3100:3100"

  # Promtail Log Collector
  promtail:
    image: grafana/promtail:latest
    container_name: antika_promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - antika_network
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: antika_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}:3001
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - antika_network
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

  # Redis Exporter for Prometheus
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: antika_redis_exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - antika_network
    restart: unless-stopped
    depends_on:
      - redis

  # Postgres Exporter for Prometheus
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: antika_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://antika_user:${POSTGRES_PASSWORD}@postgres:5432/antika_db?sslmode=disable
    networks:
      - antika_network
    restart: unless-stopped
    depends_on:
      - postgres

networks:
  antika_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
