# Docker Compose with Redis Sentinel (Sprint 1)
# High-availability Redis setup with automatic failover

version: '3.8'

services:
  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfilename "appendonly.aof"
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-master-data:/data
    networks:
      - antika-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Replica 1
  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    ports:
      - "6380:6379"
    command: >
      redis-server
      --replicaof redis-master 6379
      --appendonly yes
    depends_on:
      - redis-master
    volumes:
      - redis-replica-1-data:/data
    networks:
      - antika-network

  # Redis Replica 2
  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    ports:
      - "6381:6379"
    command: >
      redis-server
      --replicaof redis-master 6379
      --appendonly yes
    depends_on:
      - redis-master
    volumes:
      - redis-replica-2-data:/data
    networks:
      - antika-network

  # Sentinel 1
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    ports:
      - "26379:26379"
    command: >
      sh -c "echo 'port 26379
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000' > /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - antika-network

  # Sentinel 2
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    ports:
      - "26380:26379"
    command: >
      sh -c "echo 'port 26379
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000' > /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - antika-network

  # Sentinel 3
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    ports:
      - "26381:26379"
    command: >
      sh -c "echo 'port 26379
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000' > /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - antika-network

  # PgBouncer - PostgreSQL Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    ports:
      - "6432:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: antika
      DB_USER: ${POSTGRES_USER:-antika}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-antika123}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 100
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10
      MAX_DB_CONNECTIONS: 100
      SERVER_IDLE_TIMEOUT: 30
      SERVER_LIFETIME: 3600
      SERVER_CONNECT_TIMEOUT: 15
    depends_on:
      - postgres
    networks:
      - antika-network

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antika123}
      POSTGRES_DB: antika
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - antika-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antika}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      # Database connection via PgBouncer
      DATABASE_URL: postgresql://${POSTGRES_USER:-antika}:${POSTGRES_PASSWORD:-antika123}@pgbouncer:6432/antika
      
      # Redis Sentinel configuration
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_PASSWORD: ${REDIS_PASSWORD:-}
      
      # Timeout configurations
      AUTOBID_TIMEOUT: 2500
      API_CALL_TIMEOUT: 1000
      REDIS_OP_TIMEOUT: 100
      DB_QUERY_TIMEOUT: 500
      
      # Circuit breaker settings
      CIRCUIT_BREAKER_ENABLED: "true"
      
      # JWT settings
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_HOURS: 1
    depends_on:
      - redis-master
      - redis-sentinel-1
      - pgbouncer
    networks:
      - antika-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  postgres-data:

networks:
  antika-network:
    driver: bridge
